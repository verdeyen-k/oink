<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oink Pig Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #2a1730; --panel: #3b2244; --panel2: #4b2d57; --line: #6b4479; --text: #fff4f8;
    --muted: #d6b8d8; --pink: #ff8fb1; --pink2: #ff5c8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.3 'Fredoka', system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  #app { display: grid; grid-template-columns: 290px 1fr 250px; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / 4; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 3px solid var(--line); flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; color: var(--pink); text-shadow: 2px 2px 0 #0006; }
  #counter { background: var(--panel2); border-radius: 999px; padding: 4px 14px; font-weight: 600; }
  #saveMsg { color: #ffd43b; font-weight: 600; }
  .spacer { flex: 1; }
  .btn { background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; padding: 6px 14px;
    cursor: pointer; font-weight: 600; }
  .btn:hover { border-color: var(--pink); }
  .btn.big { background: var(--pink2); border-color: transparent; color: #fff; box-shadow: 0 3px 0 #a8324f; }
  .btn.on { background: var(--pink); color: #2a1730; border-color: #fff; }

  /* pig list */
  #side { background: var(--panel); border-right: 3px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; border-bottom: 2px solid var(--line); }
  #filters button { padding: 4px 8px; border-radius: 10px; font-size: 18px; }
  #list { overflow-y: auto; padding: 6px 10px 20px; flex: 1; }
  #list h3 { margin: 14px 0 6px; font-size: 15px; color: var(--muted); }
  .pig { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 6px; margin-bottom: 3px;
    background: none; border: 2px solid transparent; border-radius: 10px; cursor: pointer; text-align: left; }
  .pig:hover { background: var(--panel2); }
  .pig.sel { border-color: var(--pink); background: var(--panel2); }
  .pig canvas { width: 40px; height: 40px; image-rendering: pixelated; background: #ffffff14; border-radius: 6px; flex: none; }
  .pig .icons { font-size: 18px; flex: 1; }
  .pig .nm { display: block; font-size: 12px; color: var(--muted); }
  .pig .tick { font-size: 16px; }

  /* drawing */
  #middle { display: flex; flex-direction: column; align-items: center; padding: 14px; gap: 10px; overflow: auto; min-height: 0; }
  #title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #title .icons { font-size: 30px; }
  #title .elname { font-size: 22px; font-weight: 700; }
  #name { background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 5px 10px; width: 180px; }
  #tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #grid { width: min(70vh, 100%, 560px); aspect-ratio: 1; image-rendering: pixelated; border: 4px solid var(--line);
    border-radius: 10px; touch-action: none; cursor: crosshair; background: #fff; }
  #palette { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .sw { width: 30px; height: 30px; border-radius: 8px; border: 3px solid #0004; cursor: pointer; padding: 0; }
  .sw.on { border-color: #fff; transform: scale(1.15); }
  #custom { width: 40px; height: 34px; border: none; background: none; cursor: pointer; padding: 0; }
  #copyRow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #copyFrom { background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 5px; max-width: 260px; }

  /* previews */
  #right { background: var(--panel); border-left: 3px solid var(--line); padding: 14px; display: flex;
    flex-direction: column; gap: 12px; align-items: center; overflow-y: auto; }
  #right h2 { margin: 0; font-size: 20px; }
  .prev { text-align: center; font-weight: 600; }
  .prev canvas { display: block; width: 160px; height: 160px; image-rendering: pixelated; background: #8fd16a;
    border-radius: 12px; border: 3px solid var(--line); margin-top: 4px; }
  #speed { width: 160px; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #000c; padding: 10px 18px;
    border-radius: 12px; font-weight: 600; display: none; }

  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto; height: auto; }
    header { grid-column: 1; }
    #side { max-height: 40vh; border-right: none; }
    #right { flex-direction: row; flex-wrap: wrap; justify-content: center; border-left: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🐷 Oink Pig Maker</h1>
    <span id="counter">0 / 130 drawn</span>
    <span id="saveMsg"></span>
    <span class="spacer"></span>
    <button class="btn" id="loadBtn">📂 Load file</button>
    <input type="file" id="loadFile" accept=".js,.json" hidden>
    <button class="btn big" id="exportBtn">💾 Export pigs.js</button>
  </header>

  <aside id="side">
    <div id="filters"></div>
    <div id="list"></div>
  </aside>

  <main id="middle">
    <div id="title">
      <span class="icons" id="curIcons"></span>
      <span class="elname" id="curName"></span>
      <input id="name" maxlength="40" placeholder="Pig's name (optional)">
    </div>
    <div id="tools">
      <button class="btn tool" data-tool="pencil" title="Pencil (B)">✏️ Pencil</button>
      <button class="btn tool" data-tool="eraser" title="Eraser (E)">🧽 Eraser</button>
      <button class="btn tool" data-tool="fill" title="Fill (G)">🪣 Fill</button>
      <button class="btn tool" data-tool="picker" title="Pick a colour from the picture (I)">💉 Pick</button>
      <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)">↩️</button>
      <button class="btn" id="redoBtn" title="Redo (Ctrl+Y)">↪️</button>
      <button class="btn" id="flipBtn" title="Flip left/right">↔️ Flip</button>
      <button class="btn" id="clearBtn">🗑️ Clear</button>
    </div>
    <canvas id="grid" width="512" height="512"></canvas>
    <div id="palette"></div>
    <div id="copyRow">
      <span>Start from:</span>
      <select id="copyFrom"></select>
      <button class="btn" id="copyBtn">📋 Copy</button>
    </div>
  </main>

  <aside id="right">
    <h2>Animations</h2>
    <div class="prev">😐 Idle<canvas id="pIdle" width="32" height="32"></canvas></div>
    <div class="prev">🚶 Walk<canvas id="pWalk" width="32" height="32"></canvas></div>
    <div class="prev">💥 Attack<canvas id="pAttack" width="32" height="32"></canvas></div>
    <label class="hint">Speed<br><input type="range" id="speed" min="2" max="12" value="6"></label>
    <p class="hint">Draw your pig facing <b>right</b>. The bottom quarter of your drawing is the legs.
      The maker makes the animations by itself!</p>
  </aside>
</div>
<div id="toast"></div>

<script src="elements.js"></script>
<script src="pigart.js"></script>
<script src="maker.js"></script>
</body>
</html>
