<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Oink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #2a1730; --panel: #3b2244; --panel2: #4b2d57; --line: #6b4479; --text: #fff4f8; --muted: #d6b8d8;
    --pink: #ff8fb1; --pink2: #ff5c8a; --blue: #4dabf7; --red: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 17px/1.35 'Fredoka', system-ui, sans-serif; }
  button { font: inherit; color: inherit; }
  #ui { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 56px; margin: 4px 0; color: var(--pink); text-shadow: 4px 4px 0 #0006; text-align: center; }
  h2 { margin: 18px 0 8px; font-size: 24px; }
  .center { text-align: center; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.c { justify-content: center; }
  .btn { background: var(--panel2); border: 3px solid var(--line); border-radius: 14px; padding: 8px 16px; cursor: pointer;
    font-weight: 600; }
  .btn:hover:not(:disabled) { border-color: var(--pink); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.on { background: var(--pink); color: var(--bg); border-color: #fff; }
  .btn.go { background: var(--pink2); border-color: transparent; color: #fff; font-size: 22px; padding: 12px 22px;
    box-shadow: 0 4px 0 #a8324f; }
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .mode { background: var(--panel); border: 3px solid var(--line); border-radius: 18px; padding: 14px; text-align: center; }
  .mode h3 { margin: 0 0 4px; font-size: 24px; }
  .mode p { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .card { background: var(--panel); border: 3px solid var(--line); border-radius: 14px; padding: 6px; cursor: pointer;
    text-align: center; position: relative; }
  .card:hover { border-color: var(--pink); }
  .card.pick { border-color: #ffd43b; background: #5a4a2a; }
  .card.team { border-color: var(--blue); background: #22406a; }
  .card.used { opacity: .35; cursor: default; }
  .card canvas { width: 80px; height: 80px; image-rendering: pixelated; display: block; margin: 0 auto; }
  .card .lab { font-size: 18px; }
  .card .nm { font-size: 13px; color: var(--muted); word-break: break-word; }
  .card .badge { position: absolute; top: 4px; right: 6px; font-size: 14px; }
  .slots { display: flex; gap: 8px; }
  .slot { width: 96px; height: 96px; border: 3px dashed var(--line); border-radius: 14px; display: grid; place-items: center;
    background: #0002; }
  .slot canvas { width: 72px; height: 72px; image-rendering: pixelated; }
  .box { background: var(--panel); border: 3px solid var(--line); border-radius: 18px; padding: 14px; }
  #mergeBar { min-height: 52px; }
  .court { display: flex; flex-direction: column; gap: 6px; }
  .lane { display: grid; grid-template-columns: 130px repeat(6, 1fr); gap: 4px; align-items: center; }
  .lane .who { font-weight: 600; }
  .lane .sp { height: 38px; border-radius: 8px; background: #ffffff12; display: grid; place-items: center; font-size: 22px; }
  .lane .sp.end { background: #ffd43b33; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; margin-right: 4px; }
  ul.res { margin: 6px 0; padding-left: 22px; }

  /* battle */
  #battle { position: fixed; inset: 0; background: #1a0f1f; display: none; }
  #battle canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); cursor: crosshair;
    touch-action: none; }
  #battleMsg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;
    background: #000b; border-radius: 22px; padding: 20px 30px; display: none; }
  #battleMsg h2 { font-size: 44px; margin: 0 0 8px; }
  .touch { position: absolute; display: none; user-select: none; touch-action: none; }
  #stick { left: 24px; bottom: 24px; width: 150px; height: 150px; border-radius: 50%; background: #ffffff22; border: 3px solid #fff5; }
  #knob { position: absolute; left: 45px; top: 45px; width: 60px; height: 60px; border-radius: 50%; background: #fff8; }
  #tAttack, #tSwitch { width: 96px; height: 96px; border-radius: 50%; background: #ff5c8acc; border: 3px solid #fff8;
    font-size: 40px; display: grid; place-items: center; }
  #tAttack { right: 30px; bottom: 30px; }
  #tSwitch { right: 140px; bottom: 30px; width: 74px; height: 74px; font-size: 30px; background: #4dabf7cc; }
  #quit { position: absolute; top: 10px; right: 10px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #000d; padding: 12px 20px;
    border-radius: 14px; font-weight: 600; display: none; z-index: 10; text-align: center; }
</style>
</head>
<body>
<div id="ui"></div>
<div id="battle">
  <canvas id="arena" width="960" height="600"></canvas>
  <div id="stick" class="touch"><div id="knob"></div></div>
  <div id="tSwitch" class="touch">🔄</div>
  <div id="tAttack" class="touch">💥</div>
  <button class="btn" id="quit">✖ Quit</button>
  <div id="battleMsg"></div>
</div>
<div id="toast"></div>

<script src="elements.js"></script>
<script src="pigart.js"></script>
<script src="pigs.js"></script>
<script src="rules.js"></script>
<script src="battle.js"></script>
<script src="ai.js"></script>
<script src="game.js"></script>
</body>
</html>
